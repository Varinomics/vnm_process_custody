name: Process Custody Linux

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CMAKE_BUILD_TYPE: Release
  CMAKE_BUILD_PARALLEL_LEVEL: '4'
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CCACHE_MAXSIZE: 2GiB
  CCACHE_COMPILERCHECK: content
  LINUX_SYSTEM_DEPS: >-
    libgl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev
    libxi-dev libxext-dev libwayland-dev libxkbcommon-dev libvulkan-dev
    fontconfig fonts-dejavu-core fonts-liberation ccache ninja-build

jobs:
  build-and-test:
    name: Process Custody And Terminal Owner (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout surface contract
        uses: actions/checkout@v5
        with:
          repository: Varinomics/vnm_terminal_surface
          ref: master
          path: surface
          persist-credentials: false

      - name: Prepare owner integration project
        run: |
          mkdir -p "${RUNNER_TEMP}/custody-ci-source"
          cat > "${RUNNER_TEMP}/custody-ci-source/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.25)
          project(custody_owner_integration LANGUAGES C CXX)
          include(CTest)
          set(VNM_TERMINAL_SURFACE_BUILD_TESTING OFF CACHE BOOL "" FORCE)
          set(VNM_PROCESS_CUSTODY_BUILD_TESTS ON CACHE BOOL "" FORCE)
          set(VNM_PROCESS_CUSTODY_BUILD_TERMINAL_OWNER ON CACHE BOOL "" FORCE)
          set(VNM_PROCESS_CUSTODY_BUILD_TERMINAL_OWNER_TESTS ON CACHE BOOL "" FORCE)
          add_subdirectory("$ENV{GITHUB_WORKSPACE}/surface" surface)
          add_subdirectory("$ENV{GITHUB_WORKSPACE}" custody)
          CMAKE

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${LINUX_SYSTEM_DEPS}

      - name: Identify compiler cache
        id: compiler_cache
        run: |
          echo "CCACHE_DIR=${RUNNER_TEMP}/vnm-process-custody-ccache" >> "${GITHUB_ENV}"
          {
            ccache --version
            gcc --version
            g++ --version
            sha256sum "$(command -v gcc)" "$(command -v g++)" "$(command -v ccache)" \
              "$(gcc -print-prog-name=cc1)" "$(g++ -print-prog-name=cc1plus)"
          } | tee "${RUNNER_TEMP}/compiler-cache-toolchain.txt"
          toolchain_hash=$(sha256sum "${RUNNER_TEMP}/compiler-cache-toolchain.txt" | cut -d ' ' -f 1)
          echo "key_prefix=${RUNNER_OS}-${RUNNER_ARCH}-process-custody-ccache-${CMAKE_BUILD_TYPE}-${toolchain_hash}-" >> "${GITHUB_OUTPUT}"

      - name: Restore compiler cache
        id: restore_compiler_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler_cache.outputs.key_prefix }}${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.compiler_cache.outputs.key_prefix }}${{ github.job }}-
            ${{ steps.compiler_cache.outputs.key_prefix }}

      - name: Reset compiler cache statistics
        run: ccache --zero-stats

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.12.0'
          arch: 'linux_gcc_64'
          archives: 'icu qtbase qtdeclarative'
          cache: 'true'

      - name: Configure CMake
        run: |
          cmake -B build -S "${RUNNER_TEMP}/custody-ci-source" -G Ninja \
            -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE} \
            -DVNM_TERMINAL_BUILD_BENCHMARKS=OFF \
            -DVNM_TERMINAL_ENABLE_PROFILING=OFF \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config ${CMAKE_BUILD_TYPE} --parallel 4

      - name: Run tests
        working-directory: build
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --output-on-failure --no-tests=error --output-junit results.xml \
            -E '^vnm_process_custody_(cpu_(accounting|owner_loss|client_loss)|cgroup_snapshot)_tests$'

      - name: Verify delegated CPU accounting and snapshots
        run: |
          report="${RUNNER_TEMP}/custody-delegated-native.xml"
          sudo systemd-run --wait --pipe --collect \
            --property=Delegate=yes \
            --property="User=$(id -un)" \
            --working-directory="${GITHUB_WORKSPACE}/build" \
            "$(command -v ctest)" --verbose --output-on-failure --no-tests=error \
            --output-junit "${report}" \
            -R '^vnm_process_custody_(cpu_(accounting|owner_loss|client_loss)|cgroup_snapshot)_tests$'
          python3 - "${report}" <<'PY'
          import sys
          import xml.etree.ElementTree as element_tree

          cases = element_tree.parse(sys.argv[1]).getroot().findall('.//testcase')
          expected = {
              'vnm_process_custody_cpu_accounting_tests',
              'vnm_process_custody_cpu_owner_loss_tests',
              'vnm_process_custody_cpu_client_loss_tests',
              'vnm_process_custody_cgroup_snapshot_tests',
          }
          if len(cases) != len(expected) or {case.get('name') for case in cases} != expected:
              raise SystemExit('Delegated report does not contain all four required native cases')
          for case in cases:
              if any(case.find(result) is not None for result in ('skipped', 'failure', 'error')):
                  raise SystemExit(f"Delegated native case did not pass: {case.get('name')}")
          print('All four delegated native CPU accounting and snapshot cases passed without skips')
          PY

      - name: Report compiler cache usage
        if: always() && steps.restore_compiler_cache.outcome == 'success'
        run: ccache --show-stats --verbose

      - name: Save compiler cache
        if: always() && steps.restore_compiler_cache.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.restore_compiler_cache.outputs.cache-primary-key }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linux-process-custody-${{ github.run_attempt }}
          path: |
            build/results.xml
            build/Testing/Temporary/LastTest.log
            build/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/custody-delegated-native.xml
          if-no-files-found: ignore
